# Render Blueprint for the university side of the demo: the campus portal and
# the mock SIS. The AI Course Advisor is deployed separately, from its own repo.
#
# The services need each other's (and the advisor's) public URLs, which Render
# can't know until everything exists, so those env vars are `sync: false`
# (set manually in the dashboard).
services:
  - type: web
    name: campus-mock-sis
    runtime: python
    plan: free
    rootDir: mock-sis
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ADVISOR_WEBHOOK_URL
        sync: false # https://<advisor-api>/api/webhooks/sis/scu/grade-posted
      - key: SIS_WEBHOOK_SECRET
        sync: false # must equal the advisor's SCU_SIS_WEBHOOK_SECRET
      - key: SIS_API_KEYS
        sync: false # must include the advisor's SCU_SIS_API_KEY

  - type: web
    name: campus-portal
    runtime: python
    plan: free
    rootDir: portal-server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PORTAL_URL
        sync: false # this service's own public URL (the launch `iss`)
      - key: PORTAL_PRIVATE_KEY
        sync: false # RSA private key PEM; a key generated on Render's disk would change every deploy
      - key: ADVISOR_LAUNCH_URL
        sync: false # https://<advisor-api>/lti/launch
      - key: ADVISOR_APP_ORIGIN
        sync: false # https://<advisor-app>
      - key: ADVISOR_CLIENT_ID
        value: scu-portal
      - key: ADVISOR_DEPLOYMENT_ID
        value: scu-1
